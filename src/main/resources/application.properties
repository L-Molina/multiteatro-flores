spring.application.name=multiteatro
spring.datasource.url=jdbc:mysql://localhost:3306/multiteatro_db
spring.datasource.username=root

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

mail.enabled=false
mail.from=no-reply@multiteatroflores.com

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.uploads.comprobantes-dir=uploads/comprobantes

spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=TU-USERNAME-MAILTRAP
spring.mail.password=TU-PASSWORD-MAILTRAP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true