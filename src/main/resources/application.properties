spring.application.name=multiteatro
spring.datasource.url=jdbc:mysql://localhost:3306/multiteatro_db
spring.datasource.username=root

# Evitar que se cree el esquema en base de datos (sino spring es capaz de crear y modificar nuestros esquemas en base a los parámetros de nuestras entidades)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Auth por HTTP (login con token Bearer) requiere el servidor web activo.
# Si solo necesitás lógica de negocio sin HTTP, activá la línea de abajo.
#spring.main.web-application-type=none

# ---------------------------------------------------------------------
# Envío de mail (confirmación de compra)
#
# Con mail.enabled=false NO se envía nada: el mail se imprime en el log.
# Sirve para demostrar el flujo completo sin credenciales.
#
# Para enviar de verdad, creá una cuenta gratis en https://mailtrap.io,
# copiá User y Password de la sección "SMTP Settings" abajo, ponelas en
# application-local.properties (NO en este archivo) y cambiá a true.
# ---------------------------------------------------------------------
mail.enabled=false
mail.from=no-reply@multiteatroflores.com

spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=TU-USERNAME-MAILTRAP
spring.mail.password=TU-PASSWORD-MAILTRAP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
